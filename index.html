let category="Barchasi";
const categories=["Barchasi",...new Set(dishes.map(d=>d.cat))];
const norm=s=>s.toLowerCase().replaceAll("ʻ","'").replaceAll("’","'").trim();
function renderCategories(){
document.getElementById("categories").innerHTML=categories.map(c=>`<button class="${c===category?'active':''}" onclick="setCategory('${c}')">${c}</button>`).join("");
}
function setCategory(c){category=c;renderCategories();render();}
function render(){
const q=norm(document.getElementById("search").value);
const results=dishes.filter(d=>(category==="Barchasi"||d.cat===category)&&(!q||norm(d.name+" "+d.items.join(" ")+" "+d.desc).includes(q)));
document.getElementById("message").textContent=results.length?`${results.length} ta taom topildi 😋`:"Hech narsa topilmadi. Boshqa so‘z bilan qidirib ko‘ring.";
document.getElementById("grid").innerHTML=results.map(d=>`<article class="card"><div class="emoji">${d.emoji}</div><h3>${d.name}</h3><div class="meta">⏱ ${d.time} daqiqa · ${d.cat}</div><p>${d.desc}</p><button onclick="showRecipe('${d.name}')">Retseptni ko‘rish</button></article>`).join("");
}
function showRecipe(name){
const d=dishes.find(x=>x.name===name);if(!d)return;
const box=document.getElementById("recipe");
box.style.display="block";

}
function findByIngredients(){
const words=norm(document.getElementById("ingredients").value).split(/[,،;]+/).map(x=>x.trim()).filter(Boolean);
if(!words.length){document.getElementById("message").textContent="Avval mahsulotlarni yozing. Masalan: tuxum, kartoshka, piyoz.";return}
const results=dishes.map(d=>({...d,matched:d.items.filter(i=>words.some(w=>norm(i).includes(w)||w.includes(norm(i))))})).filter(d=>d.matched.length).sort((a,b)=>b.matched.length-a.matched.length);
document.getElementById("message").textContent=results.length?`Mahsulotlaringizga mos ${results.length} ta taom topildi!`:"Mos taom topilmadi. Boshqa mahsulotlarni kiriting.";
document.getElementById("grid").innerHTML=results.map(d=>`<article class="card"><div class="emoji">${d.emoji}</div><h3>${d.name}</h3><div class="meta">⏱ ${d.time} daqiqa · Mos mahsulot: ${d.matched.join(", ")}</div><p>${d.desc}</p><button onclick="showRecipe('${d.name}')">Retseptni ko‘rish</button></article>`).join("");
}
function randomDish(){const d=dishes[Math.floor(Math.random()*dishes.length)];showRecipe(d.name)}
document.getElementById("search").addEventListener("keydown",e=>{if(e.key==="Enter")render()});
document.getElementById("ingredients").addEventListener("keydown",e=>{if(e.key==="Enter")findByIngredients()});
renderCategories();render();
</script>
